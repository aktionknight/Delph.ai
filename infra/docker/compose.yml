# Uses the MongoDB Atlas/replica-set URI supplied in the root .env.
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../../.env
    environment:
      DEMO_MODE: "false"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
